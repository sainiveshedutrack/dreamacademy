services:
  - type: web
    name: edutrack-backend
    runtime: node
    buildCommand: |
      npm install
      # Build frontend so backend can serve static assets
      cd ../frontend || exit 0
      npm install
      npm run build
      cd ../backend || exit 0
      npm run seed
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: NODE_ENV
        value: production
